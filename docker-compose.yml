version: "3"

services:
  library-service:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./app
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"
    env_file:
      - .env
    depends_on:
      - db
      - redis

  db:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - my_db:$PG_DATA

volumes:
  my_db: