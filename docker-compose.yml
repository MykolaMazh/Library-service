version: "3"

services:
  library-service:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py wait_for_db &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8080"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:14-alpine
    ports:
      - "5432:5432"
    env_file:
      - .env
    volumes:
      - my_db:/var/lib/postgresql/data


  celery-worker:
    build: .
    command: celery -A library_service worker -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - library-service

  celery-beat:
    build: .
    command: celery -A library_service beat -l info
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - redis
      - library-service
      - db


  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  my_db: